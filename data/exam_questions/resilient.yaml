# 弾力性に優れたアーキテクチャの設計

- id: E0005
  domain: resilient
  task: "2.2"
  question: |
    ある企業は、受注管理システムのデータベースとしてAmazon RDS for MySQLを1つのアベイラビリティーゾーン(AZ)で運用している。
    AZの障害が起きても、データを失わず、人手を介さずに数分以内でデータベースが使えるようにしたい。
    運用の手間が最も少ない方法はどれか。
  choices:
    - text: RDSのマルチAZ配置を有効にする
      correct: true
      reason: 別のAZにスタンバイを同期レプリケーションで保持し、障害時は自動でフェイルオーバーする
    - text: 別のAZにリードレプリカを作成し、障害時にリードレプリカをスタンドアロンに昇格させる
      reason: 昇格は手動で、非同期レプリケーションのため直近のデータを失う可能性がある
    - text: 自動バックアップを有効にし、障害時に別のAZで最新の復元可能時刻に復元する
      reason: 復元に時間がかかり、人手の作業も必要になる
    - text: 2つのAZにEC2インスタンスを用意してMySQLをインストールし、レプリケーションとフェイルオーバーの仕組みを構築する
      reason: 動作はするが、構築と運用の手間がマネージドサービスより大きい
  explanation: |
    「可用性・自動フェイルオーバー」なら マルチAZ、「読み取り性能の向上」なら リードレプリカ。
    マルチAZは同期レプリケーション、リードレプリカは非同期レプリケーションという違いも押さえる。
  related_keywords: [39, 40, 41]

- id: E0006
  domain: resilient
  task: "2.1"
  question: |
    あるECサイトでは、Webサーバーが受け付けた注文を、注文処理サーバーにHTTPで直接送っている。
    セール時に注文処理サーバーの処理が追いつかず、注文が失われることがある。
    注文処理サーバーが一時的に処理できなくても注文を失わないようにしたい。最も適した設計はどれか。
  choices:
    - text: Webサーバーは注文をAmazon SQSのキューに送信し、注文処理サーバーはキューからメッセージを取り出して処理する
      correct: true
      reason: キューが注文を保持するため、処理側が遅れたり停止したりしても注文は失われず、追いついたときに処理できる
    - text: Webサーバーは注文をAmazon SNSのトピックに発行し、注文処理サーバーのHTTPエンドポイントをサブスクライブさせる
      reason: SNSはプッシュ型で、配信先が処理できない状態が続くと注文を確実には保持できない
    - text: 注文処理サーバーのインスタンスタイプを大きくする
      reason: 処理能力は上がるが、想定を超えるピークや障害時に注文を失う問題は残る
    - text: Webサーバーで注文をメモリにためておき、5分ごとにまとめて注文処理サーバーに送る
      reason: Webサーバーが停止するとメモリ上の注文が失われる
  explanation: |
    コンポーネント間を疎結合にし、処理側の遅延や障害を吸収するのはキュー(SQS)の典型的な使い方。
    処理側はキューの長さに応じてAuto Scalingで台数を増減させる構成もよく出題される。
  related_keywords: [103, 147, 106, 105]

- id: E0007
  domain: resilient
  task: "2.2"
  question: |
    ある企業のWebアプリケーションは、1台のEC2インスタンスで動いている。
    アベイラビリティーゾーン(AZ)の障害やインスタンスの障害が起きても、サービスを継続できるようにしたい。
    この要件を満たすために組み合わせるべきものはどれか。
  choices:
    - text: 複数のAZにまたがるApplication Load Balancerを作成し、インスタンスへのトラフィックを分散する
      correct: true
      reason: ALBはヘルスチェックに失敗したインスタンスやAZへの振り分けを止め、正常なインスタンスにだけ送る
    - text: 複数のAZにまたがるAuto Scalingグループを作成し、最小台数を2以上にする
      correct: true
      reason: 障害が起きたインスタンスを自動で置き換え、AZ障害時も別のAZでインスタンスを維持できる
    - text: インスタンスタイプをより大きなものに変更する
      reason: 1台のままなので、インスタンスやAZの障害でサービスが止まる
    - text: インスタンスをクラスタープレイスメントグループに配置する
      reason: クラスタープレイスメントグループは1つのAZ内に密集して配置するもので、AZ障害には弱くなる
    - text: Elastic IPアドレスを割り当て、障害時にスクリプトで予備のインスタンスに付け替える
      reason: 切り替えまでに停止時間が発生し、予備の準備や監視も自前で行う必要がある
  explanation: |
    高可用性の基本形は「複数AZ + ロードバランサー + Auto Scaling」。
    ロードバランサーが振り分け先を切り替え、Auto Scalingが台数を維持する、という役割分担で覚える。
  related_keywords: [73, 8, 7, 71, 144]

- id: E0008
  domain: resilient
  task: "2.2"
  question: |
    あるゲーム会社は、北米・欧州・アジアの利用者向けにプレイヤーのデータを保存している。
    各地域の利用者が、近くのリージョンで1桁ミリ秒の読み書きをできるようにしたい。
    また、1つのリージョン全体に障害が起きても、ほかのリージョンで読み書きを続けられるようにしたい。最も適した方法はどれか。
  choices:
    - text: Amazon DynamoDBのグローバルテーブルを使い、3つのリージョンにレプリカを置く
      correct: true
      reason: 各リージョンのレプリカに読み書きでき(マルチアクティブ)、リージョン障害時もほかのリージョンで処理を続けられる
    - text: 1つのリージョンにDynamoDBテーブルを置き、AWS Backupで別のリージョンにバックアップをコピーする
      reason: 書き込みは1リージョンだけで遠い利用者の遅延が大きく、障害時は復元が必要になる
    - text: 1つのリージョンにAmazon RDSを置き、ほかの2リージョンにクロスリージョンのリードレプリカを作成する
      reason: 書き込みはプライマリのリージョンに限られ、遠い地域からの書き込みは遅延が大きい
    - text: 1つのリージョンにDynamoDBテーブルを置き、各リージョンにDynamoDB Accelerator(DAX)のクラスターを作成する
      reason: DAXは同じリージョンのテーブルの前に置くキャッシュで、別リージョンのテーブルには使えず、書き込みの遅延も改善しない
  explanation: |
    複数リージョンで読み書き(マルチアクティブ)なら DynamoDBグローバルテーブル。
    リレーショナルDBで複数リージョンに広げる場合は Aurora Global Database(書き込みはプライマリのリージョン)が候補になる。
  related_keywords: [46, 49, 48, 45]

# 確認: https://docs.aws.amazon.com/servicequotas/latest/userguide/configure-cloudwatch.html
- id: E0019
  domain: resilient
  task: "2.2"
  question: |
    ある企業のWebアプリケーションは、EC2 Auto Scalingでスケールアウトする。
    先日のキャンペーンで、アカウントのオンデマンドインスタンスのvCPU数のクォータ(上限)に達し、新しいインスタンスを起動できなかった。今後は上限に近づいたら事前に通知を受け、必要に応じて引き上げを申請したい。
    運用上の負荷が最も少ない方法はどれか。
  choices:
    - text: Service Quotasで該当するクォータにCloudWatchアラームを作成して通知を受け、Service Quotasから引き上げを申請する
      correct: true
      reason: クォータの使用率に対するアラームをそのまま作成でき、引き上げの申請も同じ画面からできる
    - text: Auto Scalingグループの最大キャパシティを引き上げる
      reason: グループの上限を上げても、アカウントのvCPU数のクォータは変わらず起動に失敗する
    - text: AWS Health Dashboardのイベントを、Amazon EventBridge経由で通知する
      reason: AWS側の障害やメンテナンスの通知で、クォータの使用率の通知には使えない
    - text: 担当者が毎週Trusted Advisorのサービス制限のチェックを確認し、上限に近いときはサポートケースで引き上げを依頼する
      reason: 手作業の確認になり運用負荷が大きく、急な増加には間に合わない
  explanation: |
    アカウントのクォータ(上限)は、Service Quotasで確認・引き上げ申請し、CloudWatchアラームで上限への接近を通知する。
    スケーリングできない原因が、Auto Scalingグループの設定なのか、アカウントのクォータなのかを見分ける。
  related_keywords: [190, 8, 121, 127, 129]

# 確認: https://docs.aws.amazon.com/drs/latest/userguide/CloudEndure-Concepts.html
# 確認: https://docs.aws.amazon.com/prescriptive-guidance/latest/backup-recovery/on-prem-dr-to-aws.html
- id: E0021
  domain: resilient
  task: "2.2"
  question: |
    ある企業は、自社データセンターの物理サーバーとVMware仮想マシン、合わせて40台で基幹システムを運用している。
    データセンターが被災した場合に備えて、AWSに災害対策の環境を用意したい。要件はRPOが数秒、RTOが数十分以内で、平常時のコストはできるだけ抑えたい。
    最も適した方法はどれか。
  choices:
    - text: AWS Elastic Disaster Recoveryでサーバーを継続的にレプリケートし、災害時にAWS上でサーバーを起動する
      correct: true
      reason: ブロックレベルの継続的なレプリケーションで秒単位のRPOを実現し、平常時は低コストなステージング環境だけを維持できる
    - text: AWS Backupで毎晩サーバーのバックアップを取得し、災害時にAWS上へ復元する
      reason: RPOが最大で1日分になり、復元にも時間がかかるため要件を満たさない
    - text: VM Import/Exportで毎週仮想マシンのイメージをAMIとして取り込み、災害時にそのAMIからEC2インスタンスを起動する
      reason: 取り込んだ時点までしか戻せずRPOが大きく、物理サーバーにも対応しない
    - text: AWS上に本番と同じ規模の環境を常時稼働させ、アクティブ/アクティブで運用する
      reason: RPO・RTOは満たすが、平常時から本番と同じ規模の環境を動かすためコストが最も高い
  explanation: |
    オンプレミスのサーバーを丸ごと、低コストかつ秒単位のRPO・分単位のRTOでAWSに守るなら Elastic Disaster Recovery。
    バックアップ&リストアは安いがRPO/RTOが大きく、マルチサイトは速いが高コスト、という並びでDR戦略を選ぶ。
  related_keywords: [206, 145, 146, 38, 200]

# 確認: https://docs.aws.amazon.com/ses/latest/dg/Welcome.html
# 確認: https://docs.aws.amazon.com/sns/latest/dg/sns-email-notifications.html
- id: E0025
  domain: resilient
  task: "2.1"
  question: |
    あるオンラインショップは、注文が確定するたびに、購入者ごとに注文内容を記載したHTML形式の確認メールを送りたい。
    セール時には1時間に数万通を送ることがある。メールサーバーの運用はしたくない。
    運用上の負荷が最も少ない方法はどれか。
  choices:
    - text: アプリケーションからAmazon SESのAPIを呼び出し、購入者ごとにメールを送信する
      correct: true
      reason: SESは宛先ごとに件名・本文を作ったメールを大量に送信できるマネージドサービスで、メールサーバーの運用は不要
    - text: Amazon SNSのトピックに購入者のメールアドレスをサブスクライブさせ、注文ごとにメッセージを発行する
      reason: 各アドレスで購読の確認が必要で、発行したメッセージはトピックの全購読者に届くため、購入者ごとのメールには向かない
    - text: EC2インスタンスにメールサーバーを構築し、アプリケーションからSMTPで送信する
      reason: 動作はするが、メールサーバーの構築・冗長化・パッチ適用や送信元の評価の管理が必要になる
    - text: Amazon SQSのキューに注文を送り、購入者がキューをポーリングして注文内容を受け取る
      reason: SQSはシステム間でメッセージを受け渡すキューで、購入者にメールを届ける仕組みではない
  explanation: |
    アプリから利用者へのメール(取引通知・マーケティング)を大量に送るなら SES。
    SNSのメール通知は、購読を確認した運用者などへ同じ内容を一斉に知らせる用途と区別する。
  related_keywords: [207, 106, 103, 147]

# 確認: https://aws.amazon.com/amazon-mq/faqs/
# 確認: https://docs.aws.amazon.com/amazon-mq/latest/migration-guide/concept-chapter-about.html
- id: E0026
  domain: resilient
  task: "2.1"
  question: |
    ある企業は、オンプレミスのApache ActiveMQを使って、複数の業務アプリケーション間でJMSによりメッセージをやり取りしている。
    これらのアプリケーションをAWSに移行するにあたり、メッセージブローカーのサーバー管理をやめたい。アプリケーションのコード変更は最小限にしたい。
    最も適した方法はどれか。
  choices:
    - text: Amazon MQ for ActiveMQのブローカーを作成し、アプリケーションの接続先を切り替える
      correct: true
      reason: ActiveMQのマネージドサービスで、JMSやOpenWireなど既存のAPI・プロトコルをそのまま使えるため、コード変更は接続先の設定程度で済む
    - text: Amazon SQSのキューを作成し、アプリケーションのメッセージ送受信をSQSのAPIに書き換える
      reason: マネージドにはなるが、メッセージ送受信の処理をSQSのAPIに合わせて書き換える必要がある
    - text: EC2インスタンスにActiveMQをインストールし、複数のAZに冗長構成で配置する
      reason: コード変更は少ないが、ブローカーのサーバー管理が残るため要件を満たさない
    - text: Amazon EventBridgeのイベントバスを作成し、アプリケーション間のメッセージをイベントとして振り分ける
      reason: EventBridgeはJMSに対応しておらず、送受信の処理をイベントの発行・ルールに合わせて作り直す必要がある
  explanation: |
    既存のメッセージブローカー(ActiveMQ・RabbitMQ)を、標準のAPI・プロトコルのままマネージドに移すなら Amazon MQ。
    新しく作るアプリで、シンプルなキューならSQS、Pub/SubならSNS、イベント駆動ならEventBridge、と使い分ける。
  related_keywords: [110, 103, 107, 147]
