# セキュアなアーキテクチャの設計(書き方は README の「本番形式の問題を追加する」を参照)

- id: E0001
  domain: secure
  task: "1.2"
  question: |
    ある企業は、プライベートサブネットにあるEC2インスタンスから、同じリージョンのAmazon S3バケットにあるファイルを読み書きしている。
    セキュリティ部門から、S3へのトラフィックがインターネットを経由しないようにすることを求められた。
    追加のコストを最も抑えて、この要件を満たす方法はどれか。
  choices:
    - text: S3用のゲートウェイ型VPCエンドポイントを作成し、プライベートサブネットのルートテーブルに関連付ける
      correct: true
      reason: ゲートウェイ型エンドポイントはAWSのネットワーク内でS3に接続でき、エンドポイント自体の料金もかからない
    - text: パブリックサブネットにNATゲートウェイを作成し、プライベートサブネットからのルートをNATゲートウェイに向ける
      reason: S3への通信がインターネット向けの経路を通るうえ、NATゲートウェイの時間料金とデータ処理料金がかかる
    - text: S3用のインターフェイス型VPCエンドポイントを作成し、アプリケーションの接続先をエンドポイントのDNS名に変更する
      reason: インターネットを経由しない点は満たすが、時間料金とデータ処理料金がかかるため、ゲートウェイ型よりコストが高い
    - text: EC2インスタンスをパブリックサブネットに移し、Elastic IPアドレスを割り当てる
      reason: インスタンスがインターネットから到達できる状態になり、通信もインターネット向けの経路を通る
  explanation: |
    S3とDynamoDBには、無料で使えるゲートウェイ型のVPCエンドポイントがある。
    「インターネットを経由しない」「コストを抑える」の両方を満たすのはゲートウェイ型。
    オンプレミスや別リージョンからプライベート接続したい場合は、インターフェイス型(PrivateLink)を選ぶ。
  related_keywords: [66, 67, 61, 59]

- id: E0002
  domain: secure
  task: "1.2"
  question: |
    ある企業のアプリケーションは、Amazon RDS for MySQLのデータベースに接続している。
    現在、データベースのパスワードはアプリケーションの設定ファイルに書かれている。
    パスワードをコードや設定ファイルから取り除き、30日ごとに自動でローテーションしたい。
    運用の手間が最も少ない方法はどれか。
  choices:
    - text: パスワードをAWS Secrets Managerに保存し、RDS用の自動ローテーションを有効にする。アプリケーションは起動時にSecrets Managerから取得する
      correct: true
      reason: Secrets ManagerはRDSのパスワードの自動ローテーションに標準で対応しており、ローテーションの仕組みを自作する必要がない
    - text: パスワードをSystems Manager Parameter StoreのSecureStringとして保存し、アプリケーションから取得する
      reason: 暗号化して保存はできるが、自動ローテーションの機能はないため、別途仕組みを作る必要がある
    - text: パスワードをAWS KMSで暗号化し、暗号化した値をEC2インスタンスの環境変数に設定する
      reason: ローテーションのたびに暗号化と全インスタンスへの再設定が必要で、運用の手間が大きい
    - text: パスワードをSSE-KMSで暗号化したS3バケットに保存し、Lambda関数で30日ごとに新しいパスワードを書き込む
      reason: ローテーションの仕組みを自作することになり、DB側のパスワード変更との整合も自分で管理する必要がある
  explanation: |
    「認証情報の自動ローテーション」が求められたら AWS Secrets Manager。
    Parameter Store は設定値や簡単な秘密情報の保存に向くが、自動ローテーションの機能はない。
  related_keywords: [91, 92, 89]

- id: E0003
  domain: secure
  task: "1.3"
  question: |
    ある企業は、静的なWebコンテンツをAmazon S3バケットに保存し、Amazon CloudFrontで配信している。
    利用者がCloudFrontを経由せずにS3のURLへ直接アクセスできないようにしたい。
    この要件を満たす手順はどれか。
  choices:
    - text: CloudFrontのオリジンアクセスコントロール(OAC)を作成し、S3オリジンに設定する
      correct: true
      reason: OACにより、CloudFrontはS3へのリクエストに署名し、S3側でCloudFrontからのアクセスだけを見分けられるようになる
    - text: S3バケットポリシーで、cloudfront.amazonaws.com からのアクセスを、対象のディストリビューションのARN(AWS:SourceArn)に限って許可する
      correct: true
      reason: バケットポリシーでCloudFrontからのアクセスだけを許可することで、S3への直接アクセスは拒否される
    - text: S3の静的ウェブサイトホスティングを有効にし、CloudFrontのオリジンをウェブサイトエンドポイントに変更する
      reason: ウェブサイトエンドポイントではOACを使えず、バケットを公開する必要があるため、直接アクセスを防げない
    - text: S3バケットにセキュリティグループを設定し、CloudFrontのIPアドレス範囲からの通信だけを許可する
      reason: S3バケットにはセキュリティグループを設定できない
    - text: S3 Transfer Accelerationを有効にする
      reason: 転送を高速化する機能で、アクセス元の制限とは関係がない
  explanation: |
    CloudFront経由でのみS3のコンテンツを配信する構成は、OAC(旧方式はOAI)とバケットポリシーの組み合わせ。
    バケットのパブリックアクセスはブロックしたままにできる。
  related_keywords: [78, 18]

- id: E0004
  domain: secure
  task: "1.1"
  question: |
    ある企業は、AWS Organizationsで数十のAWSアカウントを管理している。
    コンプライアンスの要件により、すべてのアカウントで、東京リージョンと大阪リージョン以外にリソースを作成できないようにする必要がある。
    各アカウントの管理者(ルートユーザーを含む)がこの制限を外せないようにしたい。最も適した方法はどれか。
  choices:
    - text: aws:RequestedRegion が東京・大阪以外のリクエストを拒否するサービスコントロールポリシー(SCP)を作成し、組織のルートまたはOUにアタッチする
      correct: true
      reason: SCPはメンバーアカウントのルートユーザーを含むすべてのプリンシパルに効き、アカウントの管理者は外せない
    - text: 各アカウントのすべてのIAMユーザーとロールに、東京・大阪以外を拒否するIAMポリシーをアタッチする
      reason: アカウントの管理者がポリシーを外せるうえ、ルートユーザーには適用されない
    - text: 各アカウントでAWS Configルールを作成し、東京・大阪以外のリソースを検出したら通知する
      reason: 作成後に検出するだけで、作成そのものを防げない
    - text: 各IAMユーザーに、東京・大阪以外を許可しないアクセス許可の境界(permissions boundary)を設定する
      reason: アカウントの管理者が境界を変更・削除でき、ルートユーザーにも効かない
  explanation: |
    複数アカウントに対して「管理者でも外せない」上限を設けるのは SCP。
    SCPは権限を与えるものではなく、アカウント内で使える権限の上限を決める。検出(Config)と防止(SCP)の違いもよく問われる。
  related_keywords: [84, 85, 80, 124]

# 確認: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-sharing.html
- id: E0018
  domain: secure
  task: "1.1"
  question: |
    ある企業は、AWS Organizationsで複数のAWSアカウントを管理している。
    ネットワークチームが自分のアカウントでVPCとサブネットを一元的に作成・管理し、各アプリケーションチームは自分のアカウントから、そのサブネットにEC2インスタンスやRDSデータベースを作成したい。コストはアプリケーションチームのアカウントごとに把握する必要がある。
    管理するVPCの数を最も少なくできる方法はどれか。
  choices:
    - text: ネットワークチームのアカウントのサブネットを、AWS Resource Access Manager(RAM)で各アプリケーションチームのアカウントと共有する
      correct: true
      reason: VPCは1つのまま、各アカウントが共有されたサブネットに自分のリソースを作成でき、費用もリソースを作ったアカウントに計上される
    - text: 各アプリケーションチームのアカウントにVPCを作成し、ネットワークチームのVPCとVPCピアリングで接続する
      reason: アカウントごとにVPCが増え、ピアリング接続とルートの管理も必要になる
    - text: 各アプリケーションチームのアカウントにVPCを作成し、AWS Transit Gatewayで相互に接続する
      reason: 接続は一元管理できるが、アカウントごとのVPCは減らない
    - text: アプリケーションチームにネットワークチームのアカウントのIAMロールを引き受けさせ、そのアカウント内にリソースを作成させる
      reason: リソースと費用がネットワークチームのアカウントに属するため、アプリケーションチームのアカウントごとにコストを把握できない
  explanation: |
    同じ組織内の複数アカウントで1つのVPCを使うなら、RAMによるVPC共有(サブネットの共有)。所有者がネットワークを管理し、参加者は自分のリソースだけを作成・管理する。
    VPCを分けたまま接続するなら、ピアリングやTransit Gatewayを使う。
  related_keywords: [180, 84, 58, 64, 65]

# 確認: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
- id: E0020
  domain: secure
  task: "1.3"
  question: |
    ある企業は、カード決済のシステムをAWS上に構築している。
    外部の監査人から、システムが使っているAWSのインフラがPCI DSSに準拠していることを示す書類を提出するよう求められた。
    最も少ない手間で書類を用意できる方法はどれか。
  choices:
    - text: AWS Artifactから、AWSのPCI DSSの準拠に関するレポートをダウンロードして提出する
      correct: true
      reason: AWSのインフラに関する第三者の監査レポートや認証を、必要なときにセルフサービスで入手できる
    - text: AWS Audit Managerで、PCI DSSのフレームワークに沿って自社のAWS利用状況の証拠を収集する
      reason: 自社の利用状況の証拠を集める仕組みで、AWSのインフラ自体の準拠を示す書類は得られない
    - text: AWS Security HubでPCI DSSのセキュリティ標準を有効にし、チェック結果を提出する
      reason: 自社のリソースの設定のチェックで、AWSのインフラの準拠を証明するものではない
    - text: AWS Configの適合パックでPCI DSS向けのルールを評価し、その結果を提出する
      reason: 自社のリソースの設定の評価で、AWS側のインフラの準拠を示す書類にはならない
  explanation: |
    責任共有モデルでは、AWSのインフラの準拠はAWSが第三者監査で証明し、その書類は AWS Artifact で入手する。
    自社の設定やワークロードの準拠は、Audit Manager・Security Hub・Configなどで自分で確認・証明する。
  related_keywords: [192, 172, 101, 124, 149]

# 確認: https://docs.aws.amazon.com/lake-formation/latest/dg/data-filtering.html
- id: E0029
  domain: secure
  task: "1.3"
  question: |
    ある小売企業は、Amazon S3上のデータレイクに全国の販売データと顧客データを保存し、Amazon Athenaで分析している。
    各地域の担当者には自分の地域の行だけを見せ、マーケティング部門には顧客の電話番号やメールアドレスの列を見せないようにしたい。
    テーブル単位のデータの複製はせず、アクセス権限を一元的に管理したい。最も適した方法はどれか。
  choices:
    - text: AWS Lake Formationでテーブルを管理し、行と列を絞り込むデータフィルターを作成して、担当者ごとにSELECT権限を付与する
      correct: true
      reason: 行レベル・列レベルのアクセス制御を一か所で設定でき、Athenaのクエリ結果にもそのまま適用される
    - text: S3バケットポリシーで、地域ごとのプレフィックスへのアクセスをIAMロールごとに許可する
      reason: プレフィックス(ファイル)単位の制御はできるが、同じファイルの中の特定の列を隠すことはできない
    - text: AWS Glueのジョブで、地域別・部門別に必要な行と列だけを抜き出したテーブルを毎日作成する
      reason: 権限ごとにデータの複製ができ、ジョブとテーブルの保守が増えるうえ、データの複製をしないという要件に反する
    - text: Athenaのワークグループを部門ごとに作成し、クエリ結果の保存先を分ける
      reason: ワークグループはクエリの実行設定やコストを分ける仕組みで、参照できる行や列を制限する機能ではない
  explanation: |
    データレイクで「行・列(セル)単位のきめ細かいアクセス制御を一元管理」と出たら Lake Formation。
    S3バケットポリシーやIAMはオブジェクト(ファイル)単位までで、列や行の制御はできない。
  related_keywords: [116, 114, 115, 18]

# 確認: https://docs.aws.amazon.com/lambda/latest/dg/configuration-codesigning.html
- id: E0031
  domain: secure
  task: "1.2"
  question: |
    ある金融機関は、AWS Lambda関数のコードをCI/CDパイプラインでビルドしてデプロイしている。
    セキュリティ部門は、承認されたパイプラインでビルドされ、その後に改ざんされていないコードだけが、Lambda関数にデプロイされるようにしたい。
    条件を満たさないコードはデプロイ自体を拒否したい。最も適した方法はどれか。
  choices:
    - text: AWS Signerでパイプラインがコードに署名し、Lambda関数のコード署名設定で署名のないコードを拒否する
      correct: true
      reason: デプロイ時に署名と改ざんの有無が検証され、信頼された署名のないコードはデプロイが拒否される
    - text: デプロイパッケージを保存するS3バケットで、AWS KMSのキーによる暗号化を有効にする
      reason: 保存時のデータを保護するが、コードを誰がビルドしたかや改ざんの有無は検証できず、デプロイも拒否されない
    - text: Amazon InspectorでLambda関数のコードと依存パッケージの脆弱性をスキャンする
      reason: 既知の脆弱性を見つける機能で、コードの出所や改ざんの有無を検証してデプロイを止めるものではない
    - text: IAMポリシーで、lambda:UpdateFunctionCode をパイプラインのIAMロールだけに許可する
      reason: デプロイできる人は絞れるが、デプロイするコード自体がビルド後に改ざんされていないかは検証できない
  explanation: |
    「信頼できるコードだけをデプロイさせる」「改ざんされていないことを保証する」は AWS Signer と Lambda のコード署名。
    暗号化(KMS)は機密性、Inspector は脆弱性、IAM は操作する人の制限で、それぞれ守るものが違う。
  related_keywords: [227, 12, 89, 99]
