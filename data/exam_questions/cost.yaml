# コストを最適化したアーキテクチャの設計

- id: E0012
  domain: cost
  task: "4.2"
  question: |
    ある研究機関は、毎晩、大量の画像を解析するバッチ処理を実行している。
    処理は途中で中断されても、チェックポイントから再開できる。翌朝までに終わればよく、実行時刻にも融通がきく。
    コンピューティングのコストを最も抑えられる方法はどれか。
  choices:
    - text: スポットインスタンスで処理を実行する
      correct: true
      reason: 中断を許容できる処理なら、オンデマンドより大幅に安いスポットインスタンスが最適
    - text: 3年間のリザーブドインスタンスを購入し、その上で処理を実行する
      reason: 夜間だけの処理では、常時稼働を前提とした予約分を使い切れず割高になる
    - text: オンデマンドインスタンスで処理を実行する
      reason: 動作はするが、スポットインスタンスより高い
    - text: Dedicated Hostsで処理を実行する
      reason: ライセンスやコンプライアンスのための物理サーバー専有で、コストは高くなる
  explanation: |
    「中断されても再開できる」「時間に融通がきく」は スポットインスタンス の合図。
    常時稼働ならリザーブドインスタンスやSavings Plans、短期・予測不能ならオンデマンド、と使い分ける。
  related_keywords: [5, 3, 2, 6, 17]

- id: E0013
  domain: cost
  task: "4.1"
  question: |
    ある企業は、アプリケーションのログをAmazon S3に保存している。
    ログは作成から30日間は頻繁に参照され、その後1年間はたまに参照される。1年を過ぎたログは監査のときにだけ参照し、取り出しには48時間かかってもよい。
    ログは7年間保存する必要がある。保存コストを最も抑えられる設定はどれか。
  choices:
    - text: ライフサイクルポリシーで、30日後にS3標準-IA、365日後にS3 Glacier Deep Archiveへ移し、7年後に削除する
      correct: true
      reason: 参照頻度に合わせて段階的に安いクラスへ移し、取り出しに時間がかかってもよい長期保存は最も安いDeep Archiveに置く
    - text: ライフサイクルポリシーで、30日後にS3 Glacier Instant Retrievalへ移し、7年後に削除する
      reason: ミリ秒で取り出せるクラスで、1年以降の取り出しにかかる時間を許容できる要件に対して割高
    - text: すべてのログをS3標準に置いたまま、7年後に削除する
      reason: 参照頻度が下がった後も最も高いクラスに置き続けることになる
    - text: ログを作成直後からS3 Glacier Deep Archiveに保存する
      reason: 最初の30日間の頻繁な参照のたびに取り出しが必要になり、要件を満たさない
  explanation: |
    アクセスパターンが時間とともに変わるデータは、ライフサイクルポリシーでストレージクラスを段階的に移す。
    Deep Archiveの標準の取り出しは12時間以内、大容量取り出しは48時間以内。
  related_keywords: [21, 19, 20, 161, 162]

- id: E0014
  domain: cost
  task: "4.2"
  question: |
    ある企業は、24時間稼働するワークロードをEC2で運用しており、今後3年間は同程度の利用が続く見込みである。
    ただし、この3年の間に、インスタンスファミリーやリージョンの変更、一部のワークロードのAWS Fargateへの移行を予定している。
    この変更に対応しながら、コンピューティングのコストを最も抑えられる購入方法はどれか。
  choices:
    - text: Compute Savings Plansを購入する
      correct: true
      reason: インスタンスファミリー・リージョンを問わずEC2に適用され、FargateやLambdaの利用にも割引が効く
    - text: EC2 Instance Savings Plansを購入する
      reason: 割引率は高いが、リージョンとインスタンスファミリーが固定され、Fargateには適用されない
    - text: スタンダードリザーブドインスタンスを購入する
      reason: インスタンスファミリーの変更ができず、Fargateにも適用されない
    - text: スポットインスタンスを使う
      reason: 中断される可能性があり、24時間稼働が必要なワークロードには向かない
  explanation: |
    長期の継続利用で、構成の変更やFargate・Lambdaへの移行がありうるなら Compute Savings Plans。
    構成が固定なら EC2 Instance Savings Plans やリザーブドインスタンスの方が割引率は高い。
  related_keywords: [4, 3, 15, 5]
