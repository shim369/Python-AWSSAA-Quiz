# コストを最適化したアーキテクチャの設計

- id: E0012
  domain: cost
  task: "4.2"
  question: |
    ある研究機関は、毎晩、大量の画像を解析するバッチ処理を実行している。
    処理は途中で中断されても、チェックポイントから再開できる。翌朝までに終わればよく、実行時刻にも融通がきく。
    コンピューティングのコストを最も抑えられる方法はどれか。
  choices:
    - text: スポットインスタンスで処理を実行する
      correct: true
      reason: 中断を許容できる処理なら、オンデマンドより大幅に安いスポットインスタンスが最適
    - text: 3年間のリザーブドインスタンスを購入し、その上で処理を実行する
      reason: 夜間だけの処理では、常時稼働を前提とした予約分を使い切れず割高になる
    - text: オンデマンドインスタンスで処理を実行する
      reason: 動作はするが、スポットインスタンスより高い
    - text: Dedicated Hostsで処理を実行する
      reason: ライセンスやコンプライアンスのための物理サーバー専有で、コストは高くなる
  explanation: |
    「中断されても再開できる」「時間に融通がきく」は スポットインスタンス の合図。
    常時稼働ならリザーブドインスタンスやSavings Plans、短期・予測不能ならオンデマンド、と使い分ける。
  related_keywords: [5, 3, 2, 6, 17]

- id: E0013
  domain: cost
  task: "4.1"
  question: |
    ある企業は、アプリケーションのログをAmazon S3に保存している。
    ログは作成から30日間は頻繁に参照され、その後1年間はたまに参照される。1年を過ぎたログは監査のときにだけ参照し、取り出しには48時間かかってもよい。
    ログは7年間保存する必要がある。保存コストを最も抑えられる設定はどれか。
  choices:
    - text: ライフサイクルポリシーで、30日後にS3標準-IA、365日後にS3 Glacier Deep Archiveへ移し、7年後に削除する
      correct: true
      reason: 参照頻度に合わせて段階的に安いクラスへ移し、取り出しに時間がかかってもよい長期保存は最も安いDeep Archiveに置く
    - text: ライフサイクルポリシーで、30日後にS3 Glacier Instant Retrievalへ移し、7年後に削除する
      reason: ミリ秒で取り出せるクラスで、1年以降の取り出しにかかる時間を許容できる要件に対して割高
    - text: すべてのログをS3標準に置いたまま、7年後に削除する
      reason: 参照頻度が下がった後も最も高いクラスに置き続けることになる
    - text: ログを作成直後からS3 Glacier Deep Archiveに保存する
      reason: 最初の30日間の頻繁な参照のたびに取り出しが必要になり、要件を満たさない
  explanation: |
    アクセスパターンが時間とともに変わるデータは、ライフサイクルポリシーでストレージクラスを段階的に移す。
    Deep Archiveの標準の取り出しは12時間以内、大容量取り出しは48時間以内。
  related_keywords: [21, 19, 20, 161, 162]

- id: E0014
  domain: cost
  task: "4.2"
  question: |
    ある企業は、24時間稼働するワークロードをEC2で運用しており、今後3年間は同程度の利用が続く見込みである。
    ただし、この3年の間に、インスタンスファミリーやリージョンの変更、一部のワークロードのAWS Fargateへの移行を予定している。
    この変更に対応しながら、コンピューティングのコストを最も抑えられる購入方法はどれか。
  choices:
    - text: Compute Savings Plansを購入する
      correct: true
      reason: インスタンスファミリー・リージョンを問わずEC2に適用され、FargateやLambdaの利用にも割引が効く
    - text: EC2 Instance Savings Plansを購入する
      reason: 割引率は高いが、リージョンとインスタンスファミリーが固定され、Fargateには適用されない
    - text: スタンダードリザーブドインスタンスを購入する
      reason: インスタンスファミリーの変更ができず、Fargateにも適用されない
    - text: スポットインスタンスを使う
      reason: 中断される可能性があり、24時間稼働が必要なワークロードには向かない
  explanation: |
    長期の継続利用で、構成の変更やFargate・Lambdaへの移行がありうるなら Compute Savings Plans。
    構成が固定なら EC2 Instance Savings Plans やリザーブドインスタンスの方が割引率は高い。
  related_keywords: [4, 3, 15, 5]

# 確認: https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html
# 確認: https://docs.aws.amazon.com/cost-management/latest/userguide/ce-rightsizing.html
- id: E0015
  domain: cost
  task: "4.2"
  question: |
    ある企業は、数百台のEC2インスタンスと、多数のAWS Lambda関数・Amazon EBSボリュームを運用している。
    多くのリソースが必要以上のサイズで作られている疑いがあり、実際の使用率に基づいて、適切なインスタンスタイプ、Lambdaのメモリ量、EBSボリュームの構成を判断したい。
    運用上の負荷が最も少ない方法はどれか。
  choices:
    - text: AWS Compute Optimizerにオプトインし、リソースごとの推奨事項を確認する
      correct: true
      reason: CloudWatchのメトリクスを分析し、EC2・Lambda・EBSなどのサイズや構成の推奨を自動で示してくれる
    - text: AWS Cost Explorerの適正化(rightsizing)の推奨事項を確認する
      reason: 対象はEC2インスタンスだけで、Lambdaのメモリ量やEBSボリュームの推奨は得られない
    - text: CloudWatchのメトリクスをダッシュボードにまとめ、担当者が使用率を分析してサイズを決める
      reason: 判断はできるが、数百のリソースを人手で分析するため運用負荷が大きい
    - text: Compute Savings Plansを購入し、すべてのリソースに割引を適用する
      reason: 単価は下がるが、リソースのサイズが過剰なことは解消されない
  explanation: |
    使用率に基づくライトサイジング(適正なサイズの判断)は Compute Optimizer。EC2だけでなくEBS・Lambda・Auto Scalingグループなども対象。
    Cost Explorerの適正化の推奨はEC2だけが対象。Savings Plansは購入方法の最適化で、サイズの見直しとは別。
  related_keywords: [130, 135, 121, 4]

# 確認: https://docs.aws.amazon.com/cost-management/latest/userguide/manage-ad.html
- id: E0016
  domain: cost
  task: "4.2"
  question: |
    ある企業では、多数の開発チームがそれぞれのAWSアカウントでEC2やLambdaなどを利用している。
    設定ミスなどで特定のサービスのコストが普段より急に増えたときに、早く気づきたい。サービスごとの利用額は月によって大きく変わるため、固定の金額のしきい値を決めるのは難しい。
    運用上の負荷が最も少ない方法はどれか。
  choices:
    - text: AWS Cost Anomaly Detectionでサービス単位のモニターを作成し、検出した異常をAmazon SNSで通知する
      correct: true
      reason: 機械学習で普段の利用パターンを学習し、固定のしきい値なしでコストの異常な増加を検出して原因の候補とともに通知する
    - text: AWS Budgetsでサービスごとにコスト予算を作成し、予算額を超えたら通知する
      reason: 固定の予算額を決めて見直し続ける必要があり、普段と比べた急な増加を検出する仕組みではない
    - text: CloudWatchで請求額の見積もり(EstimatedCharges)に固定のしきい値のアラームを作成する
      reason: 固定のしきい値が必要で、利用額が月ごとに変わる状況では異常を見分けにくい
    - text: Lambda関数で毎日Cost Explorer APIからコストを取得し、前日と比べて増えていれば通知する
      reason: 動作はするが、比較のロジックを自作して保守する必要があり運用負荷が大きい
  explanation: |
    「固定のしきい値を決めにくい」「普段と違う増え方に気づきたい」は Cost Anomaly Detection の合図。
    決まった予算額に対する実績・予測の超過を通知したいなら AWS Budgets を選ぶ。
  related_keywords: [199, 136, 135, 121]

# 確認: https://docs.aws.amazon.com/cur/latest/userguide/what-is-cur.html
- id: E0017
  domain: cost
  task: "4.4"
  question: |
    ある企業では、毎月のデータ転送料金が増え続けている。
    どのリソースで、どの時間帯に、どの種類のデータ転送(AZ間、インターネット向けなど)の料金が発生しているかを、リソースIDと時間単位で、SQLを使って詳しく分析したい。
    運用上の負荷が最も少ない方法はどれか。
  choices:
    - text: リソースIDを含む時間単位のコストと使用状況レポート(CUR)をS3に出力し、Amazon Athenaでクエリする
      correct: true
      reason: 料金と使用量の最も詳細なデータをリソース・時間単位でS3に出力でき、Athenaとの統合でそのままSQLで分析できる
    - text: AWS Cost Explorerで、使用タイプごとにコストをグラフで表示して確認する
      reason: 傾向の把握には使えるが、すべてのリソースの時間単位の明細をSQLで分析することはできない
    - text: VPCフローログをS3に保存し、Amazon Athenaで通信量をクエリする
      reason: 通信の量や相手はわかるが、どの料金がいくら発生しているかはわからない
    - text: AWS CloudTrailのログをS3に保存し、Amazon Athenaでクエリする
      reason: API操作の記録で、データ転送の料金や使用量は含まれない
  explanation: |
    リソース単位・時間単位の最も詳細な請求データを分析するなら、コストと使用状況レポート(CUR)をS3に出力してAthenaでクエリする。
    Cost Explorerはグラフでの傾向分析や予測、VPCフローログは通信内容の分析、CloudTrailは操作の監査に使う。
  related_keywords: [196, 138, 114, 135, 70]

# 確認: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html
# 確認: https://docs.aws.amazon.com/SchemaConversionTool/latest/userguide/CHAP_Welcome.html
# 確認: https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html
- id: E0022
  domain: cost
  task: "4.3"
  question: |
    ある企業は、オンプレミスのOracle Databaseを使った受注システムを運用しており、商用ライセンスの費用を削減したいと考えている。
    移行先はAmazon Aurora PostgreSQLとし、ストアドプロシージャも移行する必要がある。切り替え時のアプリケーションの停止時間は最小限にしたい。
    この要件を満たすために組み合わせるべきものはどれか。
  choices:
    - text: DMS Schema Conversion(またはAWS SCT)で、スキーマとストアドプロシージャをAurora PostgreSQL向けに変換する
      correct: true
      reason: 異種エンジン間の移行では、スキーマやコードの変換が必要になる
    - text: AWS DMSで全ロードを行った後、継続的なレプリケーション(CDC)で変更を同期し続け、同期が追いついた時点で切り替える
      correct: true
      reason: 移行中もソースDBを稼働させたまま変更を反映し続けられるため、停止時間を最小限にできる
    - text: AWS Application Migration ServiceでデータベースサーバーをそのままEC2にリホストする
      reason: Oracle Databaseのまま動かすことになり、商用ライセンスの費用は削減できない
    - text: Oracleのエクスポートツールでダンプを取得し、Aurora PostgreSQLにインポートする
      reason: ダンプ取得から取り込み完了までアプリを止める必要があり、Oracle形式のダンプは異種エンジンにそのまま取り込めない
    - text: AWS DMSだけでデータを移行し、ストアドプロシージャも同時に移行する
      reason: DMSが移行するのはデータで、ストアドプロシージャなどのコードを別のエンジン向けに変換する機能はない
  explanation: |
    異種DBの移行は「スキーマ変換(SCT / DMS Schema Conversion)+ データ移行(DMS)」の組み合わせ。
    停止時間を最小にするには、全ロードの後にCDCで差分を同期し続け、追いついたところで切り替える。
  related_keywords: [131, 132, 133, 43]

# 確認: https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html
- id: E0023
  domain: cost
  task: "4.1"
  question: |
    ある物流会社は、取引先から毎日SFTPで受け取る出荷データを、オンプレミスのSFTPサーバーに保存している。
    この受け取り口をAWSに移し、データをAmazon S3に保存して分析に使いたい。取引先には接続先のホスト名の変更以外の作業を求めたくない。
    運用上の負荷が最も少ない方法はどれか。
  choices:
    - text: AWS Transfer FamilyでSFTPサーバーを作成し、保存先にS3バケットを指定する
      correct: true
      reason: フルマネージドのSFTPエンドポイントで受け取ったファイルを直接S3に保存でき、取引先は既存のSFTPクライアントをそのまま使える
    - text: EC2インスタンスにSFTPサーバーを構築し、受け取ったファイルをスクリプトでS3にコピーする
      reason: 動作はするが、OSやSFTPサーバーのパッチ適用・冗長化・コピー処理の運用が必要になる
    - text: AWS DataSyncのエージェントを取引先に配布し、取引先のストレージからS3へ転送させる
      reason: 取引先にエージェントの設置と運用を求めることになり、SFTPでの受け取りという今の手順も変わる
    - text: AWS Storage Gatewayのファイルゲートウェイを作成し、取引先にNFSでファイルを書き込んでもらう
      reason: ファイルゲートウェイはNFS/SMBで使うもので、取引先はSFTPからの切り替えが必要になる
  explanation: |
    「既存のSFTP/FTPの手順を変えずに、保存先をS3/EFSにしたい」は Transfer Family。
    自社のストレージから定期的にデータを移す・同期するならDataSync、オンプレミスからS3をファイル共有として使うならStorage Gateway、と使い分ける。
  related_keywords: [204, 37, 35, 18]
