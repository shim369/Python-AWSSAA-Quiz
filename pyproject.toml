[project]
name = "python-awssaa-quiz"
version = "0.1.0"
description = "AWS SAA-C03 対策の4択クイズアプリ(Streamlit)"
readme = "README.md"
authors = [
    { name = "Shimpei Ohtani", email = "ohtani.shimpei@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
